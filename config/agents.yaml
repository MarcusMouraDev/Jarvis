version: 1
default_model: local
models:
  gemini:
    provider: google
    costs_extra: true
    fallback: [codex-openai]
  codex-openai:
    provider: openai
    costs_extra: true
    fallback: [cursor-text]
  cursor-text:
    provider: cursor
    costs_extra: false
    fallback: []
  local:
    provider: local
    costs_extra: false
    fallback: [cursor-text]
agents:
  Hermes:
    workspace_mode: optional_existing
    mutation_mode: controlled
    tools:
      [
        code.context,
        terminal.read,
        terminal.run,
        file.patch,
        omniroute.list_models,
        omniroute.check_quota,
        omniroute.compression_status,
        omniroute.usage_report,
      ]
    memory_policy: manual
    budget_usd: 0
    timeout_ms: 300000
